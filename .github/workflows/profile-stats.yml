name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate most-used languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=PasinduRansika&layout=compact&langs_count=6&bg_color=0d1117&title_color=7ee787&text_color=c9d1d9&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=PasinduRansika&show_icons=true&bg_color=0d1117&title_color=7ee787&text_color=c9d1d9&icon_color=58a6ff&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile stats cards"
          git push
